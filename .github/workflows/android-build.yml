name: Android Build

# 用 NDK 交叉编译 BlueZ 命令行工具，产出可直接推到手机上运行的静态依赖可执行文件。
# 只有这一个 workflow：构建 + 打包 + tag 时自动发 release。

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装构建工具
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential autoconf automake libtool autoconf-archive \
            pkg-config gettext m4 bison flex zip
          python3 -m pip install --upgrade --quiet meson ninja

      - name: 配置 NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: 缓存交叉编译依赖
        uses: actions/cache@v4
        with:
          path: .android-build/prefix/${{ matrix.abi }}
          key: bluez-deps-${{ matrix.abi }}-glib2.80.5-dbus1.14.10-r27c-v1

      - name: 交叉编译
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: ./android/build-android.sh ${{ matrix.abi }}

      - name: 校验产物
        run: |
          set -e
          ABI=${{ matrix.abi }}
          ls -l dist/$ABI
          for f in dist/$ABI/*; do
            file "$f" | grep -q ELF || { echo "不是 ELF: $f"; exit 1; }
          done
          echo "--- 动态依赖（应只有系统库）---"
          for f in dist/$ABI/*; do
            echo "$(basename "$f"):"
            ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d "$f" \
              | awk '/NEEDED/{print "  " $NF}'
          done

      - name: 打包
        run: |
          set -e
          ABI=${{ matrix.abi }}
          cd dist
          zip -9 -r "bluez-android-$ABI.zip" "$ABI"
          ls -l "bluez-android-$ABI.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: bluez-android-${{ matrix.abi }}
          path: dist/bluez-android-${{ matrix.abi }}.zip
          if-no-files-found: error

  release:
    name: 发布 release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建/更新 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          ls -l artifacts
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "BlueZ $TAG (Android)" \
              --notes "BlueZ 命令行工具的 Android 交叉编译版本（NDK r27c, API 29）。

          包含：btmon、bluetoothctl、btmgmt、l2ping、l2test、rctest、btattach、btsnoop、btinfo。
          只动态依赖 libc.so / libm.so / libdl.so，其余（glib/dbus/readline）全部静态链入。

          用法：解压后 adb push 到 /data/local/tmp 并 chmod +x。"
          fi
          gh release upload "$TAG" artifacts/*.zip --repo "$GITHUB_REPOSITORY" --clobber
